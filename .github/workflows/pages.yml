# Deploys the web game in src/ to GitHub Pages on every push to main.
# The site opens on the self-serve flow; the original flow stays reachable as classic.html
# (the self-serve title links to index.html?classic, which the root page routes there).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run game tests
        run: node --test 'tests/**/*.mjs'

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (self-serve flow as the front page)
        run: |
          mkdir _site
          cp -R src/. _site/
          rm -f _site/CLAUDE.md
          mv _site/index.html _site/classic.html
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>마라부자</title>
            <script>location.replace(location.search.includes('classic') ? 'classic.html' : 'self-serve.html')</script>
          </head>
          <body><a href="self-serve.html">마라부자 시작하기</a></body>
          </html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
